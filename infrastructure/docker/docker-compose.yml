version: "3.9"

# AEGIS NEXUS — Full Stack Docker Compose
# Development / local deployment

networks:
  aegis-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  qdrant-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:

  # ============================================================
  # Core Infrastructure
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegis_nexus
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks: [aegis-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-aegis_redis_dev}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [aegis-network]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [aegis-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [aegis-network]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: aegis-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks: [aegis-network]

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks: [aegis-network]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegis_neo4j_dev}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    networks: [aegis-network]

  # ============================================================
  # Application Services
  # ============================================================

  intelligence-api:
    build:
      context: ../../services/intelligence-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:-aegis_dev_secret}@postgres/aegis_nexus
      KAFKA_BOOTSTRAP: kafka:9092
      QDRANT_HOST: qdrant
      REDIS_URL: redis://:${REDIS_PASSWORD:-aegis_redis_dev}@redis:6379
      NEO4J_URI: bolt://neo4j:7687
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
      qdrant:   {condition: service_started}
    networks: [aegis-network]
    restart: unless-stopped

  ai-agents:
    build:
      context: ../../services/ai-agents
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      QDRANT_HOST: qdrant
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:-aegis_dev_secret}@postgres/aegis_nexus
    depends_on:
      kafka:    {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [aegis-network]
    restart: unless-stopped
    deploy:
      replicas: 2

  event-pipeline:
    build:
      context: ../../services/event-stream
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      QDRANT_HOST: qdrant
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      kafka:  {condition: service_healthy}
      qdrant: {condition: service_started}
    networks: [aegis-network]
    restart: unless-stopped

  web-crawler:
    build:
      context: ../../services/web-crawler
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CRAWL_INTERVAL: "300"
      SOURCES_CONFIG: /app/config/sources.yaml
    depends_on:
      kafka: {condition: service_healthy}
    networks: [aegis-network]
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://intelligence-api:8000
      NEXT_PUBLIC_WS_URL: ws://intelligence-api:8000
    ports:
      - "3000:3000"
    depends_on: [intelligence-api]
    networks: [aegis-network]
    restart: unless-stopped

  # ============================================================
  # Observability Stack
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [aegis-network]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-aegis_grafana_dev}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aegis.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [aegis-network]

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks: [aegis-network]
    command: -config.file=/etc/loki/local-config.yaml

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    networks: [aegis-network]
